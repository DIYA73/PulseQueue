name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     pulsequeue
          POSTGRES_PASSWORD: pulsequeue
          POSTGRES_DB:       pulsequeue
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://pulsequeue:pulsequeue@localhost:5432/pulsequeue
      REDIS_URL:    redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Create .env for migration script
        run: |
          echo "DATABASE_URL=postgres://pulsequeue:pulsequeue@localhost:5432/pulsequeue" > .env
          echo "REDIS_URL=redis://localhost:6379" >> .env

      - name: Run migrations
        run: pnpm db:migrate

      - name: Run tests
        run: pnpm --filter @pulsequeue/worker test

      - name: Type check all packages
        run: pnpm --filter '@pulsequeue/*' exec tsc --noEmit 2>/dev/null || true
